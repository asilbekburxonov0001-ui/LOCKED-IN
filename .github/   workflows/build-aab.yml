name: Android AAB Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Rename AAB
        run: |
          mkdir -p release
          cp app/build/outputs/bundle/release/*.aab release/BLOCK-BLAST-${GITHUB_RUN_NUMBER}.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK-BLAST-AAB
          path: release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            release/*.aab \
            --title "BLOCK BLAST ${TAG}" \
            --notes "Android App Bundle build ${GITHUB_RUN_NUMBER}" \
            || echo "Release creation failed. Check GitHub Actions logs."
