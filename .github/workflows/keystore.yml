name: make-keystore
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - run: |
          keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.KS_PASS }}" -keypass "${{ secrets.KS_PASS }}" -dname "CN=LOCKED IN, O=LOCKED IN, C=UZ"
          base64 -w0 upload.jks > keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            upload.jks
            keystore.b64
