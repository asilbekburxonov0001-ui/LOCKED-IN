name: LOCKED IN AAB Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Project
        run: |
          pwd
          ls -la
          test -f pubspec.yaml

      - name: Initialize Android
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LOCKED-IN-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            build/app/outputs/bundle/release/app-release.aab \
            --title "LOCKED IN Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android AAB build."
