name: build-aab
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: ./setup.sh
      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload.jks\n" "${{ secrets.KS_PASS }}" "${{ secrets.KS_PASS }}" > android/key.properties
          python3 - <<'EOF'
          p='android/app/build.gradle.kts'
          s=open(p).read()
          blk='''    signingConfigs {
                  create("release") {
                      val k = java.util.Properties().apply { load(java.io.FileInputStream(rootProject.file("key.properties"))) }
                      keyAlias = k["keyAlias"] as String
                      keyPassword = k["keyPassword"] as String
                      storeFile = file(k["storeFile"] as String)
                      storePassword = k["storePassword"] as String
                  }
              }
              buildTypes {'''
          s=s.replace('    buildTypes {',blk,1).replace('signingConfigs.getByName("debug")','signingConfigs.getByName("release")')
          open(p,'w').write(s)
          EOF
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: build/app/outputs/bundle/release/app-release.aab
