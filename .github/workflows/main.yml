name: LOCKED IN - Android AAB Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Initialize Android Project
        working-directory: locked_in
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Build Release AAB
        working-directory: locked_in
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Prepare Release
        run: |
          mkdir -p release
          cp locked_in/build/app/outputs/bundle/release/app-release.aab \
          release/LOCKED-IN-${GITHUB_RUN_NUMBER}.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOCKED-IN-AAB
          path: release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            release/*.aab \
            --title "LOCKED IN ${TAG}" \
            --notes "Automated Android App Bundle build."
