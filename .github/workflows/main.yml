name: Build Android AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AAB
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Prepare AAB
        run: |
          mkdir -p release
          cp app/build/outputs/bundle/release/*.aab release/APP-${GITHUB_RUN_NUMBER}.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: release/*.aab

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            release/*.aab \
            --title "Android Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android AAB build"
