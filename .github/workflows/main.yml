name: LOCKED IN Android AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -o locked_in_android.zip -d extracted
          ls -la extracted/locked_in

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Initialize Flutter Android
        working-directory: extracted/locked_in
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Build Release AAB
        working-directory: extracted/locked_in
        run: |
          flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LOCKED-IN-AAB
          path: extracted/locked_in/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            extracted/locked_in/build/app/outputs/bundle/release/app-release.aab \
            --title "LOCKED IN ${TAG}" \
            --notes "Automated Android AAB build"
